name: Cooperative Fund Platform CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Automated Testing & Verification
  # ----------------------------------------------------------------------------
  test:
    name: Run Automated Test Suite (147 Tests)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Repository Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Execute Vitest Automated Test Suite
        run: npm test

  # ----------------------------------------------------------------------------
  # Job 2: Production Build & Asset Validation
  # ----------------------------------------------------------------------------
  build:
    name: Validate Production Vite Bundle
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Production Bundle
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/
          retention-days: 7

  # ----------------------------------------------------------------------------
  # Job 3: Docker Container Build & Health Validation
  # ----------------------------------------------------------------------------
  docker:
    name: Build & Verify Docker Production Container
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repository Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Production Multi-Stage Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: coop-fund-system:latest
