version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Main Web & Mobile Frontend Service
  # ----------------------------------------------------------------------------
  coop_web_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coop_fund_web
    restart: always
    ports:
      - "${WEB_PORT:-80}:80"
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=${API_BASE_URL:-/api/v1}
    depends_on:
      coop_postgres_db:
        condition: service_healthy
      coop_redis_cache:
        condition: service_started
    networks:
      - coop_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 2. Production PostgreSQL Relational Database (21-Entity Normalized Schema)
  # ----------------------------------------------------------------------------
  coop_postgres_db:
    image: postgres:16-alpine
    container_name: coop_fund_postgres
    restart: always
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coop_fund_db}
      POSTGRES_USER: ${POSTGRES_USER:-coop_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CoopSecurePass2026!}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - coop_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coop_admin} -d ${POSTGRES_DB:-coop_fund_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. Redis Cache & Sliding-Window Rate Limiter
  # ----------------------------------------------------------------------------
  coop_redis_cache:
    image: redis:7-alpine
    container_name: coop_fund_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-RedisSecure2026!}
    volumes:
      - redis_data:/data
    networks:
      - coop_network

# ------------------------------------------------------------------------------
# Persistent Storage Volumes & Private Network
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  coop_network:
    driver: bridge
